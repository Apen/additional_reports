name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  tests:
    name: TYPO3 ${{ matrix.typo3 }} / PHP 8.4
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        typo3: ['^13.4', '^14']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite
          tools: composer:v2
          coverage: pcov
      - name: Install dependencies
        run: composer require --no-interaction --no-progress --with-all-dependencies "typo3/cms-core:${{ matrix.typo3 }}" "typo3/cms-reports:${{ matrix.typo3 }}" "typo3/testing-framework:^9"
      - name: Lint PHP
        run: find . -name '*.php' ! -path './.Build/*' -print0 | xargs -0 -n1 php -l
      - name: Unit tests
        run: composer test:unit
      - name: Functional tests
        run: composer test:functional

  quality:
    name: Quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - run: composer composer:normalizedry
      - run: composer php:ecsdry
      - run: composer php:fixdry
      - run: composer php:phpstan
      - run: composer typoscript:lint
