<table class="table table-striped table-hover">
    <tbody>
    <tr>
        <td class="notice col-xs-6">
            <f:translate key="LLL:EXT:additional_reports/Resources/Private/Language/locallang.xlf:flushalllog"/>
        </td>
        <td class="notice col-xs-6"><code>DELETE FROM sys_log WHERE error &gt; 0;</code></td>
    </tr>
    </tbody>
</table>

<div class="table-fit">
    <table class="table table-striped table-hover table-condensed">
        <thead>
        <tr>
            <th colspan="3">
                <f:translate key="LLL:EXT:additional_reports/Resources/Private/Language/locallang.xlf:logerrors_description"/>
            </th>
        </tr>
        <tr>
            <th class="additional-reports-column-compact">
                <span class="additional-reports-sort">
                    <f:translate key="LLL:EXT:additional_reports/Resources/Private/Language/locallang.xlf:counter"/>
                    <span class="btn-group btn-group-sm" role="group">
                        <a class="btn btn-default" title="{f:translate(key:'LLL:EXT:core/Resources/Private/Language/locallang_core.xlf:labels.sorting.desc')}" aria-label="{f:translate(key:'LLL:EXT:core/Resources/Private/Language/locallang_core.xlf:labels.sorting.desc')}" href="{f:be.uri(route:paginationRoute,parameters:{orderby:'nb DESC',action:'detail',extension:'additional_reports',report:reportname})}"><core:icon identifier="actions-sort-amount-down" size="small"/></a>
                        <a class="btn btn-default" title="{f:translate(key:'LLL:EXT:core/Resources/Private/Language/locallang_core.xlf:labels.sorting.asc')}" aria-label="{f:translate(key:'LLL:EXT:core/Resources/Private/Language/locallang_core.xlf:labels.sorting.asc')}" href="{f:be.uri(route:paginationRoute,parameters:{orderby:'nb ASC',action:'detail',extension:'additional_reports',report:reportname})}"><core:icon identifier="actions-sort-amount-up" size="small"/></a>
                    </span>
                </span>
            </th>
            <th class="additional-reports-column-date">
                <span class="additional-reports-sort">
                    <f:translate key="LLL:EXT:additional_reports/Resources/Private/Language/locallang.xlf:tstamp"/>
                    <span class="btn-group btn-group-sm" role="group">
                        <a class="btn btn-default" title="{f:translate(key:'LLL:EXT:core/Resources/Private/Language/locallang_core.xlf:labels.sorting.desc')}" aria-label="{f:translate(key:'LLL:EXT:core/Resources/Private/Language/locallang_core.xlf:labels.sorting.desc')}" href="{f:be.uri(route:paginationRoute,parameters:{orderby:'tstamp DESC',action:'detail',extension:'additional_reports',report:reportname})}"><core:icon identifier="actions-sort-amount-down" size="small"/></a>
                        <a class="btn btn-default" title="{f:translate(key:'LLL:EXT:core/Resources/Private/Language/locallang_core.xlf:labels.sorting.asc')}" aria-label="{f:translate(key:'LLL:EXT:core/Resources/Private/Language/locallang_core.xlf:labels.sorting.asc')}" href="{f:be.uri(route:paginationRoute,parameters:{orderby:'tstamp ASC',action:'detail',extension:'additional_reports',report:reportname})}"><core:icon identifier="actions-sort-amount-up" size="small"/></a>
                    </span>
                </span>
            </th>
            <th>
                <f:translate key="LLL:EXT:additional_reports/Resources/Private/Language/locallang.xlf:error"/>
            </th>
        </tr>
        </thead>
        <tbody>
        <f:for each="{paginator.paginatedItems}" as="item">
            <tr>
                <td>{item.nb}</td>
                <td>
                    <f:format.date format="d/m/Y H:i:s">@{item.tstamp}</f:format.date>
                </td>
                <td>
                    {item.details}<br/>
                    <span class="text-body-secondary"><core:icon identifier="actions-delete" size="small"/> <code>DELETE FROM sys_log WHERE error&gt;0 AND details = "{item.details}"</code></span>
                </td>
            </tr>
        </f:for>
        </tbody>
    </table>
</div>

<f:render partial="Pagination" arguments="{_all}"/>
