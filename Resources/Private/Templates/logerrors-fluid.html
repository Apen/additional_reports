<table class="table table-striped table-hover">
    <tbody>
    <tr>
        <td class="notice col-xs-6">
            <f:translate key="LLL:EXT:additional_reports/Resources/Private/Language/locallang.xlf:flushalllog"/>
        </td>
        <td class="notice col-xs-6"><code>DELETE FROM sys_log WHERE error &gt; 0;</code></td>
    </tr>
    </tbody>
</table>

<div class="table-fit">
    <table class="table table-striped table-hover table-condensed">
        <thead>
        <tr>
            <th colspan="3">
                <f:translate key="LLL:EXT:additional_reports/Resources/Private/Language/locallang.xlf:logerrors_description"/>
            </th>
        </tr>
        <tr>
            <th width="100">
                <f:translate key="LLL:EXT:additional_reports/Resources/Private/Language/locallang.xlf:counter"/>
                <a href="{f:be.uri(route:paginationRoute,parameters:{orderby:'nb DESC',action:'detail',extension:'additional_reports',report:reportname})}"><img src="{f:uri.resource(path:'Icons/reddown.gif',extensionName:'additional_reports')}"/></a>
                <a href="{f:be.uri(route:paginationRoute,parameters:{orderby:'nb ASC',action:'detail',extension:'additional_reports',report:reportname})}"><img src="{f:uri.resource(path:'Icons/redup.gif',extensionName:'additional_reports')}"/></a>
            </th>
            <th width="100">
                <f:translate key="LLL:EXT:additional_reports/Resources/Private/Language/locallang.xlf:tstamp"/>
                <a href="{f:be.uri(route:paginationRoute,parameters:{orderby:'tstamp DESC',action:'detail',extension:'additional_reports',report:reportname})}"><img src="{f:uri.resource(path:'Icons/reddown.gif',extensionName:'additional_reports')}"/></a>
                <a href="{f:be.uri(route:paginationRoute,parameters:{orderby:'tstamp ASC',action:'detail',extension:'additional_reports',report:reportname})}"><img src="{f:uri.resource(path:'Icons/redup.gif',extensionName:'additional_reports')}"/></a>
            </th>
            <th>
                <f:translate key="LLL:EXT:additional_reports/Resources/Private/Language/locallang.xlf:error"/>
            </th>
        </tr>
        </thead>
        <tbody>
        <f:for each="{paginator.paginatedItems}" as="item">
            <tr>
                <td>{item.nb}</td>
                <td>
                    <f:format.date format="d/m/Y H:i:s">@{item.tstamp}</f:format.date>
                </td>
                <td>
                    {item.details}<br/>
                    <img src="{f:uri.resource(path:'Icons/garbage.gif',extensionName:'additional_reports')}"/>DELETE FROM sys_log WHERE error>0 AND details = "{item.details}"
                </td>
            </tr>
        </f:for>
        </tbody>
    </table>
</div>

<f:render partial="Pagination" arguments="{_all}"/>
