<f:if condition="{events}">
    <div class="table-fit">
        <table class="table table-striped table-hover table-condensed">
            <thead>
            <tr>
                <th>
                    Event
                </th>
                <th>
                    Listener
                </th>
                <th>
                    Service
                </th>
                <th>
                    Method
                </th>
            </tr>
            </thead>
            <tbody>
            <f:for each="{events}" as="event">
                <tr>
                    <td>{event.event}</td>
                    <td>{event.identifier}</td>
                    <td>{event.service}</td>
                    <td>{event.method}</td>
                </tr>
            </f:for>
            </tbody>
        </table>
    </div>
</f:if>
