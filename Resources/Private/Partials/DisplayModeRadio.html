<f:if condition="{checked}">
    <f:then>
        <input class="form-check-input" data-url="{url}" type="radio" name="display" value="{mode}" id="radio{mode}" checked="checked"/>
    </f:then>
    <f:else>
        <input class="form-check-input" data-url="{url}" type="radio" name="display" value="{mode}" id="radio{mode}"/>
    </f:else>
</f:if>
